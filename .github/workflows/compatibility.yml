name: Compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run tests, structure checks, and compatibility verification
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-plugin-verifier-report
          path: build/reports/pluginVerifier
