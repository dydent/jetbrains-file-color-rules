name: Compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests, structure checks, and compatibility verification
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-plugin-verifier-report
          path: build/reports/pluginVerifier
