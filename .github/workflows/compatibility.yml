name: Compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run tests, structure checks, and compatibility verification
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-plugin-verifier-report
          path: build/reports/pluginVerifier
