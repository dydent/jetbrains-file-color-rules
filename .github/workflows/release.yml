name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.PRIVATE_KEY != '' && secrets.CERTIFICATE_CHAIN != '' }}
      HAS_MARKETPLACE_SECRETS: ${{ secrets.PUBLISH_TOKEN != '' && secrets.PRIVATE_KEY != '' && secrets.CERTIFICATE_CHAIN != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate version
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d " ")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Test, verify, and build
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin
      - name: Sign plugin
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin
      - name: Select release archive and checksum
        run: |
          ARCHIVE=$(find build/distributions -name "*.zip" -type f | sort | tail -n 1)
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "RELEASE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --generate-notes --verify-tag "${PRERELEASE[@]}"
      - name: Publish to JetBrains Marketplace
        if: env.HAS_MARKETPLACE_SECRETS == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
